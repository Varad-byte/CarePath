<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePath — Log In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Simple, elegant static background */
            background: linear-gradient(135deg, #ecfdf5 0%, #f8fafc 100%);
        }

        /* Clean White Card */
        .auth-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            position: relative;
            
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Logo */
        .logo-container {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            animation: gentleFloat 4s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Floating Labels & Inputs */
        .form-floating .form-control {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 500;
            color: #334155;
            transition: all 0.3s ease;
        }

        .form-floating .form-control:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .form-floating label {
            color: #64748b;
            font-size: 0.95rem;
            padding-left: 1.25rem;
        }

        .password-toggle {
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
            padding: 0.5rem;
        }
        .password-toggle:hover { color: #10b981; }

        /* Glowing Button */
        .btn-glow {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
            color: white;
        }
        
        .btn-glow:hover::before { opacity: 1; }

        /* Staggered Animations */
        .stagger {
            opacity: 0;
            transform: translateX(-10px);
            animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideRight {
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Links */
        .auth-link {
            color: #10b981;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            position: relative;
        }
        .auth-link:hover { color: #059669; }
        .auth-link::after {
            content: '';
            position: absolute;
            width: 100%; height: 2px;
            bottom: -2px; left: 0;
            background-color: #059669;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        .auth-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="logo-container">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h2 class="fw-bold mb-1" style="color: #0f172a; letter-spacing: -0.5px;">Welcome Back</h2>
            <p class="text-muted small">Log in to your healthcare dashboard</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Floating Email Input -->
            <div class="form-floating mb-3 stagger" style="animation-delay: 0.1s;">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email"><i class="bi bi-envelope me-2"></i>Email address</label>
            </div>
            
            <!-- Floating Password Input -->
            <div class="form-floating mb-2 stagger position-relative" style="animation-delay: 0.2s;">
                <input type="password" class="form-control pe-5" id="password" placeholder="Password" required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                <span class="password-toggle position-absolute top-50 end-0 translate-middle-y me-2" onclick="togglePassword('password', 'toggleIconLogin')">
                    <i class="bi bi-eye-slash fs-5" id="toggleIconLogin"></i>
                </span>
            </div>

            <div class="text-end mb-4 stagger" style="animation-delay: 0.3s;">
                <a href="#" class="auth-link small" style="font-weight: 600;">Forgot Password?</a>
            </div>

            <!-- Alert Box -->
            <div id="alertMsg" class="alert d-none small p-2 rounded-3 text-center border-0 text-white stagger shadow-sm" style="animation-delay: 0.35s;" role="alert"></div>

            <!-- Submit Button -->
            <div class="stagger" style="animation-delay: 0.4s;">
                <button type="submit" class="btn-glow d-flex justify-content-center align-items-center gap-2">
                    <span>Sign In</span>
                    <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            </div>
            
            <!-- Footer Link -->
            <div class="text-center small mt-4 pt-2 stagger border-top border-secondary border-opacity-10" style="animation-delay: 0.5s;">
                <span class="text-muted fw-medium">New to CarePath?</span> 
                <a href="signup.html" class="auth-link ms-1">Create an account</a>
            </div>
        </form>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Email and password are required!', 'danger');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...';
            btn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> Success';
                    btn.style.background = '#10b981';
                    localStorage.setItem('carepath_user', email);
                    if (data.profile) {
                        localStorage.setItem('carepath_health_profile', JSON.stringify({
                            email: email,
                            ...data.profile
                        }));
                    }
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } else {
                    showAlert(data.error || 'Invalid credentials.', 'danger');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert("Backend server is not running! Start 'node auth-server.js' first.", 'warning');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showAlert(message, type) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = `alert alert-${type} small p-2 text-center mb-3 rounded-3 border-0 stagger text-white shadow-sm`;
            if(type === 'success') alertMsg.classList.add('bg-success');
            if(type === 'danger') alertMsg.classList.add('bg-danger');
            if(type === 'warning') alertMsg.classList.add('bg-warning', 'text-dark');
            
            alertMsg.innerText = message;
            alertMsg.classList.remove('d-none');
        }
    </script>
</body>
</html>
