<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePath — Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg my-navbar sticky-top bg-white border-bottom shadow-sm" style="padding: 0.85rem 1.5rem;">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#" style="font-size: 1.35rem; font-weight: 800; color: #0f172a; text-decoration: none;">
                <span class="logo-icon text-success fs-4">
                    <i class="bi bi-heart-pulse-fill"></i>
                </span>
                <span>CarePath</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-sm border-0 rounded-4 p-4" style="background-color: #ffffff; border: 1px solid #e2e8f0;">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="bi bi-person-plus text-success" style="font-size: 3rem;"></i>
                        </div>
                        <h4 class="fw-bold mt-2" style="color: #0f172a;">Create an Account</h4>
                        <p class="text-muted small">Sign up to get started.</p>
                    </div>

                    <form id="signupForm" onsubmit="handleSignup(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-dark">Email Address</label>
                            <input type="email" class="form-control rounded-3 bg-light border-0 py-2" id="email" placeholder="student@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small text-dark">Password</label>
                            <input type="password" class="form-control rounded-3 bg-light border-0 py-2" id="password" placeholder="••••••••" required>
                        </div>

                        <div id="alertMsg" class="alert d-none small p-2 rounded-3 text-center" role="alert"></div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-success rounded-3 fw-bold py-2" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none;">
                                Sign Up
                            </button>
                        </div>

                        <div class="text-center small">
                            <span class="text-muted">Already have an account?</span> 
                            <a href="login.html" class="text-success fw-bold text-decoration-none">Log In Here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-3 border-top text-center" style="background: #ffffff;">
        <p class="mb-0 small text-muted fw-semibold">CarePath Healthcare System &copy; 2026</p>
    </footer>

    <script>
        const BACKEND_URL = 'http://localhost:3000';

        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Email and password are required!', 'danger');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting to Log In...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'An error occurred', 'danger');
                }
            } catch (error) {
                showAlert("Backend server is not running! Start 'node auth-server.js' first.", 'warning');
            }
        }

        function showAlert(message, type) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = `alert alert-${type} small p-2 text-center mb-3 rounded-3`;
            alertMsg.innerText = message;
            alertMsg.classList.remove('d-none');
        }
    </script>
</body>
</html>
