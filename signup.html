<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePath — Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ecfdf5 0%, #f8fafc 100%);
            padding: 2rem 1rem;
        }

        /* Clean White Card, widened for more fields */
        .auth-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.08);
            width: 100%;
            max-width: 650px;
            padding: 2.5rem 2.5rem;
            position: relative;
            
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Logo */
        .logo-container {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            margin: 0 auto 1.25rem;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            animation: gentleFloat 4s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Floating Labels & Inputs */
        .form-floating .form-control, .form-floating .form-select {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 500;
            color: #334155;
            transition: all 0.3s ease;
        }

        .form-floating .form-control:focus, .form-floating .form-select:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .form-floating label {
            color: #64748b;
            font-size: 0.95rem;
            padding-left: 1.25rem;
        }

        .password-toggle {
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
            padding: 0.5rem;
        }
        .password-toggle:hover { color: #10b981; }

        /* Glowing Button */
        .btn-glow {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
            color: white;
        }
        
        .btn-glow:hover::before { opacity: 1; }

        /* Staggered Animations */
        .stagger {
            opacity: 0;
            transform: translateX(-10px);
            animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideRight {
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Links */
        .auth-link {
            color: #10b981;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            position: relative;
        }
        .auth-link:hover { color: #059669; }
        .auth-link::after {
            content: '';
            position: absolute;
            width: 100%; height: 2px;
            bottom: -2px; left: 0;
            background-color: #059669;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        .auth-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="auth-card my-auto">
        <div class="text-center mb-4">
            <div class="logo-container">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: #0f172a; letter-spacing: -0.5px;">Health Profile</h3>
            <p class="text-muted small">Create your account and complete your medical details</p>
        </div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            
            <div class="row g-3 mb-4 stagger" style="animation-delay: 0.1s;">
                
                <!-- Email (Full Width) -->
                <div class="col-12">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email"><i class="bi bi-envelope me-2"></i>Email address</label>
                    </div>
                </div>

                <!-- Password (Half) -->
                <div class="col-md-6 position-relative">
                    <div class="form-floating">
                        <input type="password" class="form-control pe-5" id="password" placeholder="Password" required>
                        <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                        <span class="password-toggle position-absolute top-50 end-0 translate-middle-y me-3" onclick="togglePassword('password', 'toggleIconSignup1')" style="z-index: 10;">
                            <i class="bi bi-eye-slash fs-5" id="toggleIconSignup1"></i>
                        </span>
                    </div>
                </div>

                <!-- Re-enter Password (Half) -->
                <div class="col-md-6 position-relative">
                    <div class="form-floating">
                        <input type="password" class="form-control pe-5" id="repassword" placeholder="Re-enter Password" required>
                        <label for="repassword"><i class="bi bi-shield-lock me-2"></i>Re-enter Password</label>
                        <span class="password-toggle position-absolute top-50 end-0 translate-middle-y me-3" onclick="togglePassword('repassword', 'toggleIconSignup2')" style="z-index: 10;">
                            <i class="bi bi-eye-slash fs-5" id="toggleIconSignup2"></i>
                        </span>
                    </div>
                </div>

                <!-- Age (Half) -->
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="age" placeholder="Age" min="1" max="120" required>
                        <label for="age"><i class="bi bi-calendar-event me-2"></i>Age</label>
                    </div>
                </div>

                <!-- Gender (Half) -->
                <div class="col-md-6">
                    <div class="form-floating">
                        <select class="form-select" id="gender" aria-label="Gender" required>
                            <option value="" selected disabled>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                        <label for="gender"><i class="bi bi-gender-ambiguous me-2"></i>Gender</label>
                    </div>
                </div>

                <!-- Current Major Disease (Full or 2/3) -->
                <div class="col-md-8">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="currentDisease" placeholder="Current major disease">
                        <label for="currentDisease"><i class="bi bi-bandaid me-2"></i>Current Major Disease (if any)</label>
                    </div>
                </div>

                <!-- Start Date of Disease (1/3) -->
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="startDate" placeholder="Start Date">
                        <label for="startDate"><i class="bi bi-calendar-date me-2"></i>Start Date</label>
                    </div>
                </div>

                <!-- Previous Major Diseases (Full Width Textarea) -->
                <div class="col-12">
                    <div class="form-floating">
                        <textarea class="form-control" id="prevDiseases" placeholder="Previous major diseases" style="height: 80px"></textarea>
                        <label for="prevDiseases"><i class="bi bi-clipboard2-pulse me-2"></i>Previous Major Diseases (comma separated)</label>
                    </div>
                </div>

            </div>

            <!-- Alert Box -->
            <div id="alertMsg" class="alert d-none small p-2 rounded-3 text-center border-0 text-white stagger shadow-sm" style="animation-delay: 0.2s;" role="alert"></div>

            <!-- Submit Button -->
            <div class="stagger" style="animation-delay: 0.3s;">
                <button type="submit" class="btn-glow d-flex justify-content-center align-items-center gap-2">
                    <span>Complete Sign Up</span>
                    <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            </div>
            
            <!-- Footer Link -->
            <div class="text-center small mt-4 pt-3 stagger border-top border-secondary border-opacity-10" style="animation-delay: 0.4s;">
                <span class="text-muted fw-medium">Already have an account?</span> 
                <a href="login.html" class="auth-link ms-1">Log in here</a>
            </div>
        </form>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:3000';

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            
            // Gather all fields
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const repassword = document.getElementById('repassword').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const currentDisease = document.getElementById('currentDisease').value;
            const startDate = document.getElementById('startDate').value;
            const prevDiseases = document.getElementById('prevDiseases').value;

            // Client-side validation
            if (password !== repassword) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }

            if (!email || !password || !age || !gender) {
                showAlert('Please fill in all required fields!', 'danger');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Creating...';
            btn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Sending all data to the backend just in case
                    body: JSON.stringify({ 
                        email, 
                        password, 
                        age, 
                        gender, 
                        currentDisease, 
                        startDate, 
                        prevDiseases 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> Account Created!';
                    btn.style.background = '#10b981';
                    showAlert('Redirecting to log in...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    showAlert(data.error || 'An error occurred', 'danger');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert("Backend server is not running! Start 'node auth-server.js' first.", 'warning');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showAlert(message, type) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = `alert alert-${type} small p-2 text-center mb-3 rounded-3 border-0 stagger text-white shadow-sm`;
            if(type === 'success') alertMsg.classList.add('bg-success');
            if(type === 'danger') alertMsg.classList.add('bg-danger');
            if(type === 'warning') alertMsg.classList.add('bg-warning', 'text-dark');
            
            alertMsg.innerText = message;
            alertMsg.classList.remove('d-none');
        }
    </script>
</body>
</html>
